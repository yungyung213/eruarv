  <div id="category-list"></div>

<section id="editor-panel" hidden>

</div>
<div class="form-grid editor-settings"><label>공개 설정<select name="visibility"><option value="published">공개</option><option value="private">비공개</option></select></label>

<button id="publish" class="primary" type="submit">게시</button></div></form>

<section class="main-settings admin-panel"><h2 class="admin-section-title" lang="en">Settings</h2><h3 class="admin-subtitle" lang="en">Upload</h3><div class="main-upload">

</section><div class="save-actions"><span id="main-save-state" role="status"></span><button id="save-main" class="primary" type="button">적용</button></div></div><p id="upload-progress" role="status" hidden></p></section></main><script type="module" src="js/admin.js?v=31"></script></body></html>
