<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://iclrraqcwuctgiqqdxst.supabase.co; base-uri 'none'; form-action 'none'">
  <title>ERU / 비밀번호 재설정</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
  <main>
    <section id="login-panel">
      <h2>비밀번호 재설정</h2>
      <p id="reset-status" role="status"></p>
      <form id="request-reset" hidden>
        <label>기존 Supabase 이메일<input type="email" name="email" autocomplete="email" required></label>
        <button type="submit" class="primary">재설정 메일 보내기</button>
      </form>
      <form id="set-password" hidden>
        <label>새 비밀번호<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label>새 비밀번호 확인<input type="password" name="confirmation" autocomplete="new-password" minlength="8" required></label>
        <button type="submit" class="primary">새 비밀번호 저장</button>
      </form>
      <a href="admin.html" class="text-action">어드민 로그인으로 돌아가기</a>
    </section>
  </main>
  <script type="module" src="js/admin-reset.mjs"></script>
</body>
</html>
