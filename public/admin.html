<!doctype html><html lang="ko"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://use.typekit.net; font-src 'self' https://use.typekit.net; img-src 'self' https: blob: data:; media-src 'self' https: blob:; connect-src https://iclrraqcwuctgiqqdxst.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERU / contents</title><link rel="stylesheet" href="https://use.typekit.net/sbo6lzr.css"><link rel="stylesheet" href="css/common.css?v=19"><link rel="stylesheet" href="css/admin.css?v=19"><link rel="stylesheet" href="css/admin-access.css?v=22"><link rel="stylesheet" href="css/admin-writing.css?v=27"></head><body class="admin-page"><header><a class="logo" href="index.html">eru<sup>®</sup></a><span>archive / admin</span><a href="index.html" class="text-action">사이트 보기</a></header><main><p id="admin-status" role="alert" hidden></p><section id="login-panel" class="access-panel" lang="en" aria-labelledby="access-title">
  <a class="access-brand" href="index.html" aria-label="ERU home">eru<sup>®</sup></a>
  <h2 id="access-title" class="access-title">admin</h2>
  <form id="login-form">
    <label class="access-field" for="login-username">Username
      <input id="login-username" name="username" autocomplete="username" autocapitalize="none" required>
    </label>
    <div class="access-field">
      <label for="login-password">Password</label>
      <div class="access-password">
        <input id="login-password" name="password" type="password" autocomplete="current-password" aria-describedby="login-error" data-password-toggle required>
      </div>
    </div>
    <p id="login-error" class="access-feedback" role="alert" data-error></p>
    <button type="submit" class="primary access-submit" id="login-button">Log in</button>
  </form>
  <nav class="access-links" aria-label="Account help">
    <a href="admin-reset.html" class="text-action">Reset password</a>
    <a href="index.html" class="text-action">Back to site</a>
  </nav>
</section>
<section id="workspace" hidden><div class="admin-top"><h1>contents</h1><div class="top-actions"><button id="logout" type="button">Logout</button></div></div><div class="tabs" role="group" aria-label="관리 영역"><button data-tab="posts" aria-pressed="true">글 관리</button><button data-tab="categories" aria-pressed="false">분류 관리</button><button data-tab="main" aria-pressed="false">메인 화면</button></div><div id="posts-panel"><div class="admin-toolbar"><p id="post-count"></p><button id="seed" type="button" hidden>기존 데이터 가져오기</button><label class="category-filter">카테고리 <select id="post-category"></select></label><button id="new-post" class="primary" type="button">+ 새 글 쓰기</button></div><div class="post-filters">
  <div role="group" aria-label="공개 상태">
    <button type="button" data-status-filter="" aria-pressed="true">전체</button>
    <button type="button" data-status-filter="published" aria-pressed="false">공개</button>
    <button type="button" data-status-filter="draft" aria-pressed="false">임시 저장</button>
    <button type="button" data-status-filter="private" aria-pressed="false">비공개</button>
  </div>
  <input type="search" id="post-search" aria-label="제목 검색" placeholder="제목 검색">
</div>
<div class="admin-layout"><div id="post-list" aria-label="게시물 목록"></div></div></div>
<section id="categories-panel" hidden>
  <h2>분류 관리</h2>
  <form id="new-category"><label>새 카테고리<input name="value" maxlength="100" required></label><button class="primary" data-server-action>추가</button></form>
  <form id="new-character"><label>새 캐릭터<input name="value" maxlength="100" required></label><button class="primary" data-server-action>추가</button></form>
  <div id="category-list"></div>
</section>
<section id="editor-panel" hidden>
<button id="editor-close" type="button">← 게시물 목록</button>
<form id="post-form"><div class="editor-heading"><h2 id="editor-title">new post</h2><span id="post-state"></span></div><input name="id" type="hidden">
<div class="editor-columns"><div class="writing-fields">
  <label>제목<input name="title" maxlength="160" placeholder="제목을 입력하세요"></label>
  <label>본문<textarea name="body" rows="9" maxlength="20000" placeholder="글을 작성하세요"></textarea></label>
</div>
<div class="form-grid editor-settings"><label>공개 설정<select name="visibility"><option value="published">공개</option><option value="private">비공개</option></select></label>
<label>날짜<input name="date" type="date" required></label><div class="metadata-field"><span>카테고리</span><input type="hidden" name="genre"><div id="genre-picker"></div></div><div class="metadata-field"><span>캐릭터</span><input type="hidden" name="other"><div id="other-picker"></div></div><div class="metadata-field"><span>팔레트</span><input type="hidden" name="colors"><div id="palette-picker" role="group" aria-label="팔레트 선택"></div><div id="legacy-palette"></div></div><label>Thx to<input name="thxTo" placeholder="이름"></label><label>Thx to link<input name="thxUrl" type="url" placeholder="https://"></label></div></div><p class="media-help">본문이 있는 글은 첫 번째 사진을 갤러리 썸네일로, 나머지 첨부 파일을 본문 아래에 표시합니다.</p><div id="post-media" class="media-list" aria-label="게시물 미디어"></div><label class="upload-zone">사진 · GIF · 동영상 추가<input id="post-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple><span>사진 자동 최적화 · GIF·영상은 파일당 최대 4MB</span></label><div class="save-actions"><span id="editor-save-state" role="status"></span><button id="save-draft" type="button">임시 저장</button><button id="preview-post" type="button">미리보기</button>
<button id="publish" class="primary" type="submit">게시</button></div></form>
<dialog id="post-preview" class="admin-preview-dialog" aria-labelledby="post-preview-title"><button id="close-post-preview" type="button">닫기 ×</button><h2 id="post-preview-title">미리보기</h2><div id="post-preview-content"></div></dialog>
</section><div id="main-panel" hidden><div class="editor-heading"><h2>main</h2><span>이동을 잡고 끌어 순서를 바꾸세요.</span></div><section class="appearance-settings" aria-label="홈페이지 화면 설정"><fieldset><legend>화면 테마</legend><button type="button" data-theme="dark" aria-pressed="true">Dark</button><button type="button" data-theme="light" aria-pressed="false">Light</button></fieldset><fieldset><legend>점묘 효과</legend><button type="button" data-particles="true" aria-pressed="true">On</button><button type="button" data-particles="false" aria-pressed="false">Off</button></fieldset><fieldset><legend>마우스 롤오버</legend><button type="button" data-rollover="true" aria-pressed="true">On</button><button type="button" data-rollover="false" aria-pressed="false">Off</button></fieldset></section><div class="main-library">
<label for="main-library-post">업로드한 사진 사용</label>
<div class="library-actions"><select id="main-library-post"><option value="">게시물 선택</option></select><select id="main-library-image" aria-label="사진 선택" disabled></select><button id="add-library-image" type="button" disabled>슬라이드에 추가</button></div>
</div>
<div id="main-media" class="media-list main-track" aria-label="메인 슬라이드 순서"></div><label class="upload-zone">메인 미디어 추가<input id="main-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple><span>사진 자동 최적화 · GIF·영상은 파일당 최대 4MB</span></label><ol id="main-file-summary" class="file-summary" aria-label="메인 파일 내역"></ol><div class="save-actions"><span id="main-save-state" role="status"></span><button id="save-main" class="primary" type="button">적용</button></div></div><p id="upload-progress" role="status" hidden></p></section></main><script type="module" src="js/admin.js?v=27"></script></body></html>
