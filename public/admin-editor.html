<!doctype html><html lang="ko"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://use.typekit.net; font-src 'self' https://use.typekit.net; img-src 'self' https: blob: data:; media-src 'self' https: blob:; connect-src https://iclrraqcwuctgiqqdxst.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERU / upload</title><link rel="stylesheet" href="https://use.typekit.net/sbo6lzr.css"><link rel="stylesheet" href="css/common.css?v=19"><link rel="stylesheet" href="css/admin.css?v=19"></head><body class="admin-page editor-window" data-editor="true"><header><a class="logo" href="index.html">eru<sup>®</sup></a><span>archive / admin</span><a href="index.html" class="text-action">사이트 보기</a></header><main><p id="admin-status" role="alert" hidden></p><section id="login-panel"><form id="login-form"><label>아이디<input name="username" autocomplete="username" autocapitalize="none" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="login-button">로그인</button></form><p id="connection-state" role="status" hidden></p></section><section id="workspace" hidden><div class="admin-top"><h1>upload</h1><div class="top-actions"><button id="editor-close" type="button">닫기</button><button id="logout" type="button">Logout</button></div></div><div class="tabs" role="group" aria-label="관리 영역"><button data-tab="posts" aria-pressed="true">게시물</button><button data-tab="main" aria-pressed="false">메인 슬라이드</button></div><div id="posts-panel"><div class="admin-toolbar"><p id="post-count"></p><button id="seed" type="button" hidden>기존 데이터 가져오기</button><button id="new-post" type="button">upload</button></div><div class="admin-layout"><div id="post-list" aria-label="게시물 목록"></div><form id="post-form" hidden><div class="editor-heading"><h2 id="editor-title">new post</h2><span id="post-state"></span></div><input name="id" type="hidden"><div class="form-grid"><label>날짜<input name="date" type="date" required></label><div class="metadata-field"><span>카테고리</span><input type="hidden" name="genre"><div id="genre-picker"></div></div><div class="metadata-field"><span>캐릭터</span><input type="hidden" name="other"><div id="other-picker"></div></div><div class="metadata-field"><span>팔레트</span><input type="hidden" name="colors"><div id="palette-picker" role="group" aria-label="팔레트 선택"></div><div id="legacy-palette"></div></div><label>Thx to<input name="thxTo" placeholder="이름"></label><label>Thx to link<input name="thxUrl" type="url" placeholder="https://"></label></div><div id="post-media" class="media-list" aria-label="게시물 미디어"></div><label class="upload-zone">사진 · GIF · 동영상 추가<input id="post-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple><span>사진 자동 최적화 · GIF·영상은 파일당 최대 4MB</span></label><div class="save-actions"><span id="editor-save-state" role="status"></span><button id="save-draft" type="button">임시 저장</button><button id="publish" class="primary" type="submit">게시</button></div></form></div></div><div id="main-panel" hidden><div class="editor-heading"><h2>main slides</h2><span>이동을 잡고 끌어 순서를 바꾸세요.</span></div><section class="appearance-settings" aria-label="홈페이지 화면 설정"><fieldset><legend>화면 테마</legend><button type="button" data-theme="dark" aria-pressed="true">Dark</button><button type="button" data-theme="light" aria-pressed="false">Light</button></fieldset><fieldset><legend>점묘 효과</legend><button type="button" data-particles="true" aria-pressed="true">On</button><button type="button" data-particles="false" aria-pressed="false">Off</button></fieldset><p>아래 적용을 누르면 홈페이지에 반영됩니다. 점묘 효과는 정지 사진 슬라이드에 적용되며, GIF·영상이 포함되면 원본으로 재생합니다.</p></section><div id="main-media" class="media-list main-track" aria-label="메인 슬라이드 순서"></div><label class="upload-zone">메인 미디어 추가<input id="main-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple><span>사진 자동 최적화 · GIF·영상은 파일당 최대 4MB</span></label><ol id="main-file-summary" class="file-summary" aria-label="메인 파일 내역"></ol><div class="save-actions"><span id="main-save-state" role="status"></span><button id="save-main" class="primary" type="button">적용</button></div></div><p id="upload-progress" role="status" hidden></p></section></main><script type="module" src="js/admin.js?v=20"></script></body></html>
