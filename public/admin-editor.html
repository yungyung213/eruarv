<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERU / 게시물 업로드</title><link rel="stylesheet" href="https://use.typekit.net/sbo6lzr.css"><link rel="stylesheet" href="css/common.css?v=10"><link rel="stylesheet" href="css/admin.css?v=14"></head><body class="admin-page editor-window" data-editor="true"><header><a class="logo" href="index.html">eru<sup>®</sup></a><span>archive / admin</span><a href="index.html">사이트 보기 ↗</a></header><main>
<section id="login-panel"><span class="eyebrow">PRIVATE ARCHIVE</span><h1>관리자 로그인</h1><p id="connection-state">연결 상태를 확인하고 있습니다.</p><form id="login-form"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="login-button">로그인 →</button></form><button id="demo-button" type="button">어드민 화면 미리보기</button></section>
<section id="workspace" hidden><div class="admin-top"><div><span class="eyebrow">ERU ARCHIVE</span><h1>게시물 업로드</h1></div><button id="editor-close" type="button">창 닫기 ×</button><button id="logout" type="button" hidden>로그아웃</button></div><p id="demo-note" hidden>화면 미리보기입니다. 실제 업로드와 저장은 Supabase 로그인·GitHub 저장소 연결 후 사용할 수 있습니다.</p><div class="tabs" role="group" aria-label="관리 영역"><button data-tab="posts" aria-pressed="true">게시물</button><button data-tab="main" aria-pressed="false">메인 슬라이드</button></div>
<div id="posts-panel"><div class="admin-toolbar"><p id="post-count"></p><button id="seed" type="button">기존 데이터 가져오기</button><button id="new-post" type="button">게시물 업로드 ↗</button></div><div class="admin-layout"><aside id="post-list" aria-label="게시물 목록"></aside><form id="post-form" hidden><div class="editor-heading"><h2 id="editor-title">새 게시물</h2><span id="post-state">임시 저장</span></div><input name="id" type="hidden"><div class="form-grid"><label>날짜<input name="date" type="date" required></label><div class="metadata-field"><span>카테고리</span><input type="hidden" name="genre"><div id="genre-picker"></div></div><div class="metadata-field"><span>캐릭터</span><input type="hidden" name="other"><div id="other-picker"></div></div><div class="metadata-field"><span>팔레트</span><input type="hidden" name="colors"><div id="palette-picker" role="group" aria-label="고정 팔레트"></div><p id="legacy-palette"></p></div><label>크레딧<input name="thxTo" placeholder="이름"></label><label>크레딧 링크<input name="thxUrl" type="url" placeholder="https://"></label></div><label class="upload-zone">사진 · GIF · 동영상 추가<input id="post-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple><span>여러 파일 선택 · 사진 자동 최적화 · GIF·영상은 파일당 최대 4MB</span></label><div id="post-media" class="media-list"></div><div class="save-actions"><button id="save-draft" type="button">임시 저장</button><button id="publish" class="primary" type="submit">사이트에 게시 →</button></div></form></div></div>
<div id="main-panel" hidden><div class="editor-heading"><h2>메인 슬라이드</h2><span>순서대로 자동 전환됩니다.</span></div><label class="upload-zone">메인 미디어 추가<input id="main-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple><span>사진 자동 최적화 · GIF·영상은 파일당 최대 4MB</span></label><div id="main-media" class="media-list"></div><button id="save-main" class="primary" type="button">메인에 적용 →</button></div>
</section><p id="admin-status" role="status" aria-live="polite"></p></main><script type="module" src="js/admin.js"></script></body></html>
